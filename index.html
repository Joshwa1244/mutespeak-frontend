<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <title>mutespeak;</title>

    <meta
      name="description"
      content="Connect, express, and discover meaningful conversations on mutespeak."
    />
    
    <!-- Explicitly tell search engines to index the page -->
    <meta name="robots" content="index, follow" />

    <!-- Google Search Console ownership verification -->
    <!-- Get this snippet from Search Console → Settings → Ownership verification → HTML tag -->
    <!-- <meta name="google-site-verification" content="PASTE_YOUR_CODE_HERE" /> -->

    <!-- Structured data: helps Google understand the site as a brand/entity -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "mutespeak",
        "url": "https://www.mutespeak.com/",
        "description": "Connect, express, and discover meaningful conversations on mutespeak."
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="mutespeak;" />

    <meta
      property="og:description"
      content="Connect, express, and discover meaningful conversations on mutespeak."
    />

    <meta
      property="og:image"
      content="https://www.mutespeak.com/og-image.png"
    />

    <meta
      property="og:url"
      content="https://www.mutespeak.com/"
    />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="mutespeak;" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="mutespeak;" />

    <meta
      name="twitter:description"
      content="Connect, express, and discover meaningful conversations on mutespeak."
    />

    <meta
      name="twitter:image"
      content="https://www.mutespeak.com/og-image.png"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#023B1F"
    />

    <!-- Mobile Web App -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="mutespeak;"
    />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      href="/icon-192.png"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
